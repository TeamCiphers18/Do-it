<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeByt Cryptographic Terminal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- QR Code libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <!-- IPFS client (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/ipfs-http-client@56.0.3/dist/index.min.js"></script>
    <!-- Shamir's Secret Sharing library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/secrets.js/1.1.0/secrets.min.js"></script>
    <!-- No libsodium – all crypto uses WebCrypto API only -->
    <style>
        /* ... (existing CSS, unchanged) ... */
        /* ============================================
           GLOBAL STYLES & RESET (identical to original)
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            background-color: #000000;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
        }
        
        .hidden {
            display: none !important;
        }
        
        /* ============================================
           TERMINAL PAGE STYLES - LIGHTER BLUE THEME
           ============================================ */
        #terminal-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #000;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .terminal-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #000;
            overflow: hidden;
            -webkit-overflow-scrolling: touch;
        }
        
        .terminal-header {
            border-bottom: 1px solid rgba(77, 166, 255, 0.3);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.95);
            flex-shrink: 0;
            animation: slideIn 0.4s ease-out;
        }
        
        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .terminal-title {
            font-weight: bold;
            font-size: 1em;
            color: #4da6ff;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 1;
            min-width: 0;
        }
        
        .terminal-status {
            font-size: 0.75em;
            color: #66b0ff;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        
        .terminal-body-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
            min-height: 0;
            padding-bottom: 70px;
        }
        
        .line-numbers {
            width: 45px;
            background: rgba(20, 20, 20, 0.95);
            border-right: 1px solid rgba(77, 166, 255, 0.2);
            color: #66b0ff;
            font-size: 11px;
            padding: 8px 5px;
            font-family: 'Courier New', monospace;
            text-align: right;
            flex-shrink: 0;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            z-index: 2;
            height: 100%;
            -webkit-overflow-scrolling: touch;
        }
        
        .line-numbers-content {
            min-height: 100%;
        }
        
        .line-number {
            height: 18px;
            line-height: 18px;
            margin-bottom: 2px;
            opacity: 0.7;
            transition: opacity 0.3s;
            user-select: none;
        }
        
        .line-number.active {
            opacity: 1;
            color: #99ccff;
            font-weight: bold;
        }
        
        .terminal-output {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px 80px 10px;
            background: #000;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.3;
            position: relative;
            -webkit-overflow-scrolling: touch;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
        }
        
        .output-line {
            margin-bottom: 2px;
            white-space: pre-wrap;
            word-break: break-word;
            color: #e5e7eb;
            min-height: 18px;
            animation: fadeInLine 0.1s ease-out;
            padding-right: 5px;
        }
        
        .prompt {
            color: #4da6ff;
            font-weight: bold;
            font-size: 11px;
        }
        
        .terminal-input-section {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            border-top: 1px solid rgba(77, 166, 255, 0.3);
            padding: 10px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 5px;
            backdrop-filter: blur(10px);
        }
        
        .input-line {
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 18px;
            position: relative;
            width: 100%;
        }
        
        .input-line input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(77, 166, 255, 0.3);
            border-radius: 6px;
            color: #ffffff;
            font-size: 12px;
            flex: 1;
            outline: none;
            font-family: 'Courier New', monospace;
            caret-color: #4da6ff;
            padding: 6px 10px;
            min-width: 0;
            transition: all 0.3s;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        
        .input-line input:focus {
            border-color: #4da6ff;
            box-shadow: 0 0 0 2px rgba(77, 166, 255, 0.1);
            background: rgba(255, 255, 255, 0.08);
        }
        
        @keyframes fadeInLine {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .command-output { color: #e5e7eb; }
        .error-output { color: #ff6b6b; animation: shake 0.5s; }
        .success-output { color: #4ade80; animation: pop 0.3s; }
        .warning-output { color: #fbbf24; }
        .info-output { color: #60a5fa; }
        .system-output { color: #9ca3af; }
        .encode-output { color: #4da6ff; font-weight: bold; }
        .decode-output { color: #4da6ff; font-weight: bold; }
        .key-output { 
            color: #9d4edd; 
            font-family: 'Courier New', monospace; 
            background: rgba(157, 78, 221, 0.1); 
            padding: 2px 4px; 
            border-radius: 4px; 
            word-break: break-all;
            font-size: 11px;
            line-height: 1.2;
        }
        .highlight-output { color: #4da6ff; font-weight: bold; background: rgba(77, 166, 255, 0.1); padding: 2px 4px; border-radius: 3px; }
        .hash-output { color: #4dc3ff; font-weight: bold; }
        .sha256-output { color: #ff6b9d; }
        .sha384-output { color: #ffb347; }
        .sha512-output { color: #64d86b; }
        .sha3-output { color: #ffb347; }
        .rsa-output { color: #ff6b35; }
        .aes-kw-output { color: #06b6d4; }
        .hmac-output { color: #f97316; }
        .hkdf-output { color: #84cc16; }
        .pbkdf2-output { color: #ec4899; }
        .ecdh-output { color: #10b981; }
        .password-output { color: #0ea5e9; }
        .file-encrypt-output { color: #8b5cf6; }
        .file-decrypt-output { color: #3b82f6; }
        .sss-output { color: #d946ef; }
        .bip39-output { color: #f43f5e; }
        .rsa-pss-output { color: #eab308; }
        .aad-output { color: #06b6d4; }
        .salt-output { color: #ffb347; font-weight: bold; }
        
        /* new command colors */
        .benchmark-output { color: #ffa07a; }
        .entropy-output { color: #da70d6; }
        .timelock-output { color: #20b2aa; }
        .secretbox-output { color: #cd5c5c; }
        .template-output { color: #b0c4de; }
        .cryptochat-output { color: #ffb6c1; } /* kept for compatibility */
        
        /* Additional styles for new features */
        .qr-canvas, .visual-canvas {
            background: #111;
            border: 1px solid #4da6ff;
            border-radius: 8px;
            margin: 10px 0;
            max-width: 100%;
        }
        .plugin-badge {
            background: rgba(77, 166, 255, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            color: #66b0ff;
        }
        .pm-entry {
            border-left: 2px solid #0ea5e9;
            padding-left: 8px;
            margin: 4px 0;
        }
        .ipfs-cid {
            color: #00ffff;
            word-break: break-all;
        }
        .stegano-preview {
            max-width: 200px;
            border: 1px solid #4da6ff;
            margin: 5px 0;
        }
        .team-badge {
            background: #4ade80;
            color: #000;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-2px); }
            20%, 40%, 60%, 80% { transform: translateX(2px); }
        }
        
        @keyframes pop {
            0% { transform: scale(0.9); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .exit-btn {
            background: rgba(77, 166, 255, 0.1);
            border: 1px solid rgba(77, 166, 255, 0.3);
            color: #66b0ff;
            padding: 6px 10px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        
        .exit-btn:hover {
            background: rgba(77, 166, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .file-handling-section {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(77, 166, 255, 0.2);
            background: rgba(15, 15, 15, 0.9);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .file-info-display {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #66b0ff;
            font-size: 11px;
            flex-wrap: wrap;
        }
        
        .file-info-text {
            font-family: 'Courier New', monospace;
            padding: 4px 6px;
            background: rgba(77, 166, 255, 0.08);
            border-radius: 4px;
            border: 1px solid rgba(77, 166, 255, 0.2);
            font-size: 10px;
        }
        
        .file-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .file-btn {
            background: rgba(77, 166, 255, 0.1);
            border: 1px solid rgba(77, 166, 255, 0.3);
            color: #66b0ff;
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            touch-action: manipulation;
        }
        
        .file-btn:hover:not(:disabled) {
            background: rgba(77, 166, 255, 0.2);
            color: #ffffff;
            border-color: #4da6ff;
            transform: translateY(-2px);
        }
        
        .file-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .file-input-hidden {
            display: none;
        }
        
        .key-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            margin-left: auto;
            flex-shrink: 0;
        }
        
        .key-status.active {
            background: rgba(76, 222, 128, 0.1);
            color: #4ade80;
            border: 1px solid rgba(76, 222, 128, 0.3);
        }
        
        .key-status.inactive {
            background: rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }
        
        .key-display-container {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(77, 166, 255, 0.3);
            border-radius: 8px;
            padding: 10px;
            margin: 8px 0;
            overflow: hidden;
            position: relative;
        }
        
        .key-display {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            line-height: 1.2;
            color: #66b0ff;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            padding: 8px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            -webkit-overflow-scrolling: touch;
        }
        
        .key-display-full {
            max-height: 400px;
        }
        
        .key-display-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(77, 166, 255, 0.2);
        }
        
        .key-display-buttons {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        
        .key-btn {
            background: rgba(77, 166, 255, 0.1);
            border: 1px solid rgba(77, 166, 255, 0.3);
            color: #66b0ff;
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            touch-action: manipulation;
        }
        
        .key-btn:hover {
            background: rgba(77, 166, 255, 0.2);
            transform: translateY(-1px);
        }
        
        .hash-display-container {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(77, 195, 255, 0.3);
            border-radius: 8px;
            padding: 10px;
            margin: 8px 0;
            overflow: hidden;
            position: relative;
        }
        
        .hash-display {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            line-height: 1.2;
            color: #4dc3ff;
            word-break: break-all;
            max-height: 150px;
            overflow-y: auto;
            padding: 8px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            -webkit-overflow-scrolling: touch;
        }
        
        .hash-display-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(77, 195, 255, 0.2);
        }
        
        .suggestion-box {
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            background: rgba(20, 20, 20, 0.98);
            border: 1px solid rgba(77, 166, 255, 0.3);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            padding: 8px;
            display: none;
            z-index: 101;
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.8);
            max-height: 150px;
            overflow-y: auto;
            margin: 0;
            backdrop-filter: blur(10px);
            -webkit-overflow-scrolling: touch;
        }
        
        .suggestion-item {
            padding: 6px 8px;
            cursor: pointer;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            margin-bottom: 2px;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            touch-action: manipulation;
        }
        
        .suggestion-item:hover {
            background: rgba(77, 166, 255, 0.15);
            color: #4da6ff;
        }
        
        .suggestion-item.selected {
            background: rgba(77, 166, 255, 0.2);
            color: #4da6ff;
            border-left: 3px solid #4da6ff;
        }
        
        .suggestion-command {
            font-weight: 600;
            color: #4da6ff;
            font-size: 11px;
        }
        
        .suggestion-desc {
            font-size: 9px;
            color: #9ca3af;
            text-align: right;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(77, 166, 255, 0.3);
            border-radius: 50%;
            border-top-color: #4da6ff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .terminal-header {
                padding: 8px 10px;
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            
            .terminal-title {
                font-size: 0.9em;
                width: 100%;
                justify-content: space-between;
            }
            
            .terminal-status {
                width: 100%;
                justify-content: space-between;
                font-size: 0.7em;
            }
            
            .line-numbers {
                width: 35px;
                font-size: 9px;
                padding: 6px 3px;
            }
            
            .terminal-output {
                padding: 6px 8px 70px 8px;
                font-size: 11px;
            }
            
            .terminal-input-section {
                padding: 8px;
            }
            
            .input-line input {
                font-size: 11px;
                padding: 5px 8px;
            }
            
            .prompt {
                font-size: 10px;
            }
            
            .file-handling-section {
                padding: 8px 10px;
            }
            
            .file-info-display {
                gap: 6px;
            }
            
            .file-controls {
                gap: 4px;
            }
            
            .key-display {
                font-size: 9px;
                max-height: 150px;
            }
            
            .key-display-full {
                max-height: 300px;
            }
            
            .hash-display {
                font-size: 9px;
                max-height: 120px;
            }
            
            .exit-btn {
                padding: 5px 8px;
                font-size: 10px;
            }
            
            .suggestion-box {
                max-height: 120px;
            }
            
            .suggestion-item {
                padding: 5px 6px;
                font-size: 10px;
            }
            
            .suggestion-desc {
                max-width: 90px;
            }
        }
        
        @media (min-width: 481px) and (max-width: 768px) {
            .terminal-header {
                padding: 10px 12px;
            }
            
            .terminal-title {
                font-size: 1em;
            }
            
            .line-numbers {
                width: 40px;
                font-size: 10px;
            }
            
            .terminal-output {
                font-size: 12px;
            }
            
            .key-display {
                font-size: 11px;
            }
            
            .hash-display {
                font-size: 11px;
            }
        }
        
        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        button, .file-btn, .key-btn, .exit-btn {
            min-height: 32px;
            min-width: 32px;
        }
        
        @media (max-height: 500px) {
            .terminal-body-container {
                padding-bottom: 60px;
            }
            
            .key-display {
                max-height: 120px;
            }
            
            .key-display-full {
                max-height: 200px;
            }
            
            .hash-display {
                max-height: 100px;
            }
        }
        
        @media (max-width: 768px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }

        /* ===== NEW SIDEBAR STYLES (LEFT SIDE) ===== */
        .hamburger-btn {
            background: none;
            border: none;
            color: #4da6ff;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 5px;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        .hamburger-btn:hover {
            color: #66b0ff;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;                 /* moved from right to left */
            width: 280px;
            height: 100vh;
            background: #111;
            border-right: 2px solid #4da6ff;  /* border-right instead of border-left */
            z-index: 3000;
            transform: translateX(-100%);       /* hidden off screen to the left */
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            color: #e5e7eb;
            font-family: 'Courier New', monospace;
            padding: 20px 10px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5); /* shadow on right side */
        }
        .sidebar.open {
            transform: translateX(0);
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #4da6ff;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #4da6ff;
        }
        .sidebar-close {
            background: none;
            border: none;
            color: #4da6ff;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            font-size: 11px;
            line-height: 1.5;
        }
        .sidebar-section {
            margin-bottom: 15px;
            padding: 8px;
            background: rgba(77, 166, 255, 0.05);
            border-left: 3px solid #4da6ff;
        }
        .sidebar-section h4 {
            color: #4da6ff;
            margin-bottom: 5px;
            font-size: 12px;
            text-transform: uppercase;
        }
        .sidebar-section p {
            margin: 2px 0;
            word-break: break-word;
        }
        /* Quick commands removed as requested */
    </style>
</head>
<body>
    <div id="terminal-page">
        <div class="terminal-container">
            <div class="terminal-header">
                <!-- Left side: title only (hamburger moved to right) -->
                <div class="terminal-title">
                    <i class="fas fa-terminal"></i> CODEBYT CRYPTOGRAPHIC TERMINAL
                </div>

                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');
        }

        function base64urlToUint8Array(str) {
            let s = str.replace(/-/g, '+').replace(/_/g, '/');

            const binary = atob(s);
            const arr = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
            return arr;
        }

        function uint8ArrayToHex(arr) {
            return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function hexToUint8Array(hex) {
            if (hex.length % 2 !== 0) throw new Error('Invalid hex string');
            const arr = new Uint8Array(hex.length / 2);
            for (let i = 0; i < hex.length; i += 2) {
                arr[i/2] = parseInt(hex.substr(i, 2), 16);
            }
            return arr;

            crypto.getRandomValues(randomBytes);
            
            for (let i = 0; i < length; i++) {
                // rejection sampling: if byte >= maxValid, get a new byte
                let byte = randomBytes[i];
                while (byte >= maxValid) {
                    // fetch a new random byte (inefficient but secure)
                    const tmp = new Uint8Array(1);
                    crypto.getRandomValues(tmp);
                    byte = tmp[0];
                }
                result[i] = KEY_CHARSET[byte % CHARSET_LENGTH];
            }
            return result.join('');
        }

                /[!@#$%^&*()\-_=+[\]{}|;:,.<>?/~`]/.test(keyString) ? 15 : 0
            ];
            strength += charSets.reduce((a, b) => a + b, 0);
            
            let patternPenalty = 0;
            for (let i = 0; i < keyString.length - 3; i++) {
                if (keyString[i] === keyString[i+1] && keyString[i] === keyString[i+2]) {

        // ========== FIXED ECDH IMPLEMENTATION ==========
        // Uses deterministic static key derived from masterKey, ephemeral-static ECDH, and AES-GCM.
        // Now uses HKDF to derive AES key from shared secret (standard practice)
        async function createECDHAlgorithmCurve(masterKeyBytes, curve = 'P-256') {
            const textEncoder = new TextEncoder();
            const fixedSalt = textEncoder.encode("ECDH static key derivation v1");
            
            // Determine key length in bytes for the curve
            let keyLength;
            if (curve === 'P-256') keyLength = 32;
            else if (curve === 'P-384') keyLength = 48;
            else if (curve === 'P-521') keyLength = 66;
            else throw new Error("Unsupported curve");
            
            // Derive deterministic private key from masterKey
            const keyMaterial = await crypto.subtle.importKey("raw", masterKeyBytes, { name: "PBKDF2" }, false, ["deriveBits"]);
            const derivedBits = await crypto.subtle.deriveBits(
                { name: "PBKDF2", salt: fixedSalt, iterations: 310000, hash: "SHA-256" },
                keyMaterial,
                keyLength * 8
            );
            const privateKeyBytes = new Uint8Array(derivedBits);
            
            // Import static private key (this also generates the corresponding public key)
            const staticPrivateKey = await crypto.subtle.importKey(
                "raw",
                privateKeyBytes,
                { name: "ECDH", namedCurve: curve },
                true,
                ["deriveKey", "deriveBits"]
            );
            
            // Export static public key (raw)
            const staticPublicKey = await crypto.subtle.exportKey("raw", staticPrivateKey);
            
            return {
                name: `ECDH-${curve}`,
                encode: async function(text) {
                    // Generate ephemeral key pair
                    const ephemeralKeyPair = await crypto.subtle.generateKey(
                        { name: "ECDH", namedCurve: curve },
                        true,
                        ["deriveKey", "deriveBits"]
                    );
                    const ephemeralPublic = await crypto.subtle.exportKey("raw", ephemeralKeyPair.publicKey);
                    
                    // Import static public key as CryptoKey
                    const staticPublicCryptoKey = await crypto.subtle.importKey(
                        "raw",
                        staticPublicKey,
                        { name: "ECDH", namedCurve: curve },
                        true,
                        []
                    );
                    
                    // Derive shared secret using ephemeral private key and static public key
                    const sharedSecret = await crypto.subtle.deriveBits(
                        { name: "ECDH", public: staticPublicCryptoKey },
                        ephemeralKeyPair.privateKey,
                        keyLength * 8
                    );
                    
                    // Use HKDF to derive a 256-bit AES key from the shared secret (standard)
                    const hkdfSalt = crypto.getRandomValues(new Uint8Array(16));
                    const hkdfInfo = textEncoder.encode("ECDH-AES-GCM-key");
                    const hkdfKey = await crypto.subtle.importKey(
                        "raw",
                        new Uint8Array(sharedSecret),
                        { name: "HKDF" },
                        false,
                        ["deriveKey"]
                    );
                    const aesKey = await crypto.subtle.deriveKey(
                        {
                            name: "HKDF",
                            hash: "SHA-256",
                            salt: hkdfSalt,
                            info: hkdfInfo
                        },
                        hkdfKey,
                        { name: "AES-GCM", length: 256 },
                        false,
                        ["encrypt"]
                    );
                    
                    const iv = crypto.getRandomValues(new Uint8Array(12));
                    const data = textEncoder.encode(text);
                    const encrypted = await crypto.subtle.encrypt(
                        { name: "AES-GCM", iv: iv },
                        aesKey,
                        data
                    );
                    
                    // Combine ephemeral public key + hkdfSalt + iv + ciphertext
                    const combined = new Uint8Array(ephemeralPublic.length + hkdfSalt.length + iv.length + encrypted.byteLength);
                    combined.set(new Uint8Array(ephemeralPublic), 0);
                    combined.set(hkdfSalt, ephemeralPublic.length);
                    combined.set(iv, ephemeralPublic.length + hkdfSalt.length);
                    combined.set(new Uint8Array(encrypted), ephemeralPublic.length + hkdfSalt.length + iv.length);
                    
                    return uint8ArrayToBase64url(combined);
                },
                decode: async function(encodedText) {
                    const combined = base64urlToUint8Array(encodedText);
                    const keyLengthBytes = curve === 'P-256' ? 65 : (curve === 'P-384' ? 97 : 133); // uncompressed public key length
                    const ephemeralPublic = combined.slice(0, keyLengthBytes);
                    const hkdfSalt = combined.slice(keyLengthBytes, keyLengthBytes + 16);
                    const iv = combined.slice(keyLengthBytes + 16, keyLengthBytes + 28);
                    const ciphertext = combined.slice(keyLengthBytes + 28);
                    
                    // Import ephemeral public key
                    const ephemeralPublicKey = await crypto.subtle.importKey(
                        "raw",
                        ephemeralPublic,
                        { name: "ECDH", namedCurve: curve },
                        true,
                        []
                    );
                    
                    // Derive shared secret using static private key and ephemeral public key
                    const sharedSecret = await crypto.subtle.deriveBits(
                        { name: "ECDH", public: ephemeralPublicKey },
                        staticPrivateKey,
                        keyLength * 8
                    );
                    
                    // Derive AES key using HKDF with the salt that was sent
                    const hkdfKey = await crypto.subtle.importKey(
                        "raw",
                        new Uint8Array(sharedSecret),
                        { name: "HKDF" },
                        false,
                        ["deriveKey"]
                    );
                    const hkdfInfo = textEncoder.encode("ECDH-AES-GCM-key");
                    const aesKey = await crypto.subtle.deriveKey(
                        {
                            name: "HKDF",
                            hash: "SHA-256",
                            salt: hkdfSalt,
                            info: hkdfInfo
                        },
                        hkdfKey,
                        { name: "AES-GCM", length: 256 },
                        false,
                        ["decrypt"]
                    );
                    
                    const decrypted = await crypto.subtle.decrypt(
                        { name: "AES-GCM", iv: iv },
                        aesKey,
                        ciphertext
                    );
                    
                    return new TextDecoder().decode(decrypted);
                }
            };
        }

                    {

            }

                );

        async function rsaEncrypt(text) {
            if (!state.rsaKeys.publicKey) {
                throw new Error("No RSA public key available. Generate keys first.");
            }
            
            try {
                const encoder = new TextEncoder();
                const data = encoder.encode(text);
                
                const chunkSize = state.rsaKeys.keySize / 8 - 42;
                const chunks = [];
                
                for (let i = 0; i < data.length; i += chunkSize) {
                    const chunk = data.slice(i, i + chunkSize);
                    const encrypted = await crypto.subtle.encrypt(
                        { name: "RSA-OAEP" },
                        state.rsaKeys.publicKey,
                        chunk
                    );
                    chunks.push(new Uint8Array(encrypted));
                }
                
                let totalLength = 0;
                chunks.forEach(chunk => totalLength += chunk.length);
                
                const combined = new Uint8Array(totalLength);
                let offset = 0;
                chunks.forEach(chunk => {
                    combined.set(chunk, offset);
                    offset += chunk.length;
                });
                
                return uint8ArrayToBase64url(combined);
            } catch (error) {
                throw new Error(`RSA encryption failed: ${error.message}`);
            }
        }
        
        async function rsaDecrypt(encryptedText) {
            if (!state.rsaKeys.privateKey) {
                throw new Error("No RSA private key available.");
            }
            
            try {
                const data = base64urlToUint8Array(encryptedText);
                const chunkSize = state.rsaKeys.keySize / 8;
                const chunks = [];
                
                for (let i = 0; i < data.length; i += chunkSize) {
                    chunks.push(data.slice(i, i + chunkSize));
                }
                
                const decryptedChunks = [];
                for (const chunk of chunks) {
                    const decrypted = await crypto.subtle.decrypt(
                        { name: "RSA-OAEP" },
                        state.rsaKeys.privateKey,
                        chunk
                    );
                    decryptedChunks.push(new Uint8Array(decrypted));
                }
                
                let totalLength = 0;
                decryptedChunks.forEach(chunk => totalLength += chunk.length);
                
                const combined = new Uint8Array(totalLength);
                let offset = 0;
                decryptedChunks.forEach(chunk => {
                    combined.set(chunk, offset);
                    offset += chunk.length;
                });
                
                const decoder = new TextDecoder();
                return decoder.decode(combined);
            } catch (error) {
                throw new Error(`RSA decryption failed: ${error.message}`);
            }
        }

        // PASSWORD-BASED ENCRYPTION (PBKDF2 + AES-GCM) - already uses random salt
        // ============================================
        async function pbeEncrypt(password, plaintext) {
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const keyMaterial = await crypto.subtle.importKey(
                'raw', new TextEncoder().encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
            );
            const key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' },
                keyMaterial, { name: 'AES-GCM', length: 256 }, true, ['encrypt']
            );
            const encrypted = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv },
                key,
                new TextEncoder().encode(plaintext)
            );
            const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
            combined.set(salt, 0);
            combined.set(iv, salt.length);
            combined.set(new Uint8Array(encrypted), salt.length + iv.length);
            return uint8ArrayToBase64url(combined);
        }

        async function pbeDecrypt(password, encryptedText) {
            const combined = base64urlToUint8Array(encryptedText);
            const salt = combined.slice(0, 16);
            const iv = combined.slice(16, 28);
            const ciphertext = combined.slice(28);
            const keyMaterial = await crypto.subtle.importKey(
                'raw', new TextEncoder().encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
            );
            const key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' },
                keyMaterial, { name: 'AES-GCM', length: 256 }, true, ['decrypt']
            );
            const decrypted = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv },
                key,
                ciphertext
            );
            return new TextDecoder().decode(decrypted);
        }

        async function hashData(data, algorithm) {
            const encoder = new TextEncoder();
            const dataBuffer = encoder.encode(data);
            
            let hashAlgorithm;
            let outputClass;
            
            switch(algorithm.toLowerCase()) {
                case 'sha256':
                    hashAlgorithm = 'SHA-256';
                    outputClass = 'sha256-output';
                    break;
                case 'sha384':
                    hashAlgorithm = 'SHA-384';
                    outputClass = 'sha384-output';
                    break;
                case 'sha512':
                    hashAlgorithm = 'SHA-512';
                    outputClass = 'sha512-output';
                    break;
                case 'sha3-256':
                    hashAlgorithm = 'SHA3-256';
                    outputClass = 'sha3-output';
                    break;
                case 'sha3-384':
                    hashAlgorithm = 'SHA3-384';
                    outputClass = 'sha3-output';
                    break;
                case 'sha3-512':
                    hashAlgorithm = 'SHA3-512';
                    outputClass = 'sha3-output';
                    break;
                default:
                    throw new Error(`Unsupported hash algorithm: ${algorithm}. Supported: sha256, sha384, sha512, sha3-256, sha3-384, sha3-512`);
            }
            
            try {
                const hashBuffer = await crypto.subtle.digest(hashAlgorithm, dataBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                
                return {
                    hash: hashHex,
                    class: outputClass
                };
            } catch (error) {
                throw new Error(`Hashing failed: ${error.message}`);
            }
        }

        async function decryptFileContent(encryptedContent, algorithm = 'AES-GCM') {
            if (!state.isKeySet) {
                throw new Error("No encryption key set. Use 'genkey' or 'setkey' first.");
            }
            
            try {
                let algorithmInstance;
                switch(algorithm) {
                    case 'AES-GCM':
                        algorithmInstance = await createAESGCMAlgorithm(state.encryptionKey);
                        break;
                    default:
                        algorithmInstance = await createAESGCMAlgorithm(state.encryptionKey);
                }
                
                const decryptedBase64 = await algorithmInstance.decode(encryptedContent);
                
                const binary = atob(decryptedBase64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                
                return {
                    success: true,
                    decrypted: bytes.buffer,
                    algorithm: algorithm
                };
            } catch (error) {
                throw new Error(`File decryption failed: ${error.message}`);
            }
        }

        // Estimate crack time (for password strength)
        function estimateCrackTime(password) {
            const entropy = calculateEntropy(password);
            const possibilities = Math.pow(2, entropy * password.length);
            const guessesPerSecond = 1e9;
            const seconds = possibilities / guessesPerSecond;
            if (seconds < 1) return "instant";
            if (seconds < 60) return `${seconds.toFixed(1)} seconds`;
            if (seconds < 3600) return `${(seconds/60).toFixed(1)} minutes`;
            if (seconds < 86400) return `${(seconds/3600).toFixed(1)} hours`;
            if (seconds < 31536000) return `${(seconds/86400).toFixed(1)} days`;
            if (seconds < 31536000*100) return `${(seconds/31536000).toFixed(1)} years`;
            return "centuries";
        }
        
        function calculateEntropy(text) {
            if (!text || text.length === 0) return 0;
            const freq = {};
            for (let char of text) {
                freq[char] = (freq[char] || 0) + 1;
            }
            let entropy = 0;
            const len = text.length;
            for (let char in freq) {
                const p = freq[char] / len;
                entropy -= p * Math.log2(p);
            }
            return parseFloat(entropy.toFixed(3));
        }

        async function runBenchmark(iterations = 100, dataSize = 1024) {
            const results = {};
            const testData = crypto.getRandomValues(new Uint8Array(dataSize));
            const testString = uint8ArrayToBase64url(testData).substring(0, dataSize);

            async function timeIt(fn) {
                const start = performance.now();
                await fn();
                const end = performance.now();
                return end - start;
            }

            if (state.isKeySet) {
                try {
                    const aesAlgo = await createAESGCMAlgorithm(state.encryptionKey);
                    const time = await timeIt(async () => {
                        for (let i = 0; i < iterations; i++) {
                            await aesAlgo.encode(testString);
                        }
                    });
                    results['AES-GCM'] = (time / iterations).toFixed(2);
                } catch (e) { results['AES-GCM'] = 'error'; }
            }

            try {
                const time = await timeIt(async () => {
                    for (let i = 0; i < iterations; i++) {
                        await crypto.subtle.digest('SHA-256', testData);
                    }
                });
                results['SHA-256'] = (time / iterations).toFixed(2);
            } catch (e) { results['SHA-256'] = 'error'; }

            try {
                const time = await timeIt(async () => {
                    for (let i = 0; i < iterations; i++) {
                        await crypto.subtle.digest('SHA-512', testData);
                    }
                });
                results['SHA-512'] = (time / iterations).toFixed(2);
            } catch (e) { results['SHA-512'] = 'error'; }

            return results;
        }

        function analyzeEntropy(data) {
            if (!data) return { error: 'No data' };
            let str;
            if (typeof data === 'string') {
                str = data;
            } else if (data instanceof Uint8Array) {
                str = new TextDecoder().decode(data);
            } else {
                str = String(data);
            }
            const freq = {};
            for (let ch of str) {
                freq[ch] = (freq[ch] || 0) + 1;
            }
            let entropy = 0;
            const len = str.length;
            for (let ch in freq) {
                const p = freq[ch] / len;
                entropy -= p * Math.log2(p);
            }
            const charSetSize = Object.keys(freq).length;
            const maxEntropy = Math.log2(charSetSize) || 0;
            const redundancy = maxEntropy - entropy;
            return {
                entropy: entropy.toFixed(3),
                maxEntropy: maxEntropy.toFixed(3),
                redundancy: redundancy.toFixed(3),
                uniqueChars: charSetSize,
                length: len,
                bytes: new TextEncoder().encode(str).length
            };
        }

        function timelockStore(message, ttlSeconds) {
            const id = uint8ArrayToBase64url(crypto.getRandomValues(new Uint8Array(8)));
            const key = crypto.getRandomValues(new Uint8Array(32));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encoder = new TextEncoder();
            const data = encoder.encode(message);
            return crypto.subtle.importKey('raw', key, { name: 'AES-GCM' }, false, ['encrypt'])
                .then(cryptoKey => crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cryptoKey, data))
                .then(encrypted => {
                    const ciphertext = new Uint8Array(encrypted);
                    const expires = Date.now() + ttlSeconds * 1000;
                    state.timelockMessages[id] = {
                        ciphertext: uint8ArrayToBase64url(ciphertext),
                        key: uint8ArrayToBase64url(key),
                        iv: uint8ArrayToBase64url(iv),
                        expires
                    };
                    setTimeout(() => {
                        delete state.timelockMessages[id];
                    }, ttlSeconds * 1000);
                    return id;
                });
        }

        async function timelockRetrieve(id) {
            const item = state.timelockMessages[id];
            if (!item) throw new Error('Message not found or expired');
            if (Date.now() > item.expires) {
                delete state.timelockMessages[id];
                throw new Error('Message expired');
            }
            const key = base64urlToUint8Array(item.key);
            const iv = base64urlToUint8Array(item.iv);
            const ciphertext = base64urlToUint8Array(item.ciphertext);
            const cryptoKey = await crypto.subtle.importKey('raw', key, { name: 'AES-GCM' }, false, ['decrypt']);
            const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, cryptoKey, ciphertext);
            return new TextDecoder().decode(decrypted);
        }

        async function secretBoxEncrypt(message, recipientNames) {
            if (!recipientNames || recipientNames.length === 0) throw new Error('At least one recipient required');
            const symKey = crypto.getRandomValues(new Uint8Array(32));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encoder = new TextEncoder();
            const data = encoder.encode(message);
            const symCryptoKey = await crypto.subtle.importKey('raw', symKey, { name: 'AES-GCM' }, false, ['encrypt']);
            const encryptedMessage = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, symCryptoKey, data);
            const encryptedMessageB64 = uint8ArrayToBase64url(new Uint8Array(encryptedMessage));

            const encryptedKeys = {};
            for (let name of recipientNames) {
                const recipient = state.recipients[name];
                if (!recipient) throw new Error(`Recipient '${name}' not found`);
                const pubKey = await crypto.subtle.importKey(
                    'spki',
                    base64urlToUint8Array(recipient.publicKey),
                    { name: 'RSA-OAEP', hash: 'SHA-256' },
                    true,
                    ['encrypt']
                );
                const encryptedKey = await crypto.subtle.encrypt(
                    { name: 'RSA-OAEP' },
                    pubKey,
                    symKey
                );
                encryptedKeys[name] = uint8ArrayToBase64url(new Uint8Array(encryptedKey));
            }

            const output = {
                iv: uint8ArrayToBase64url(iv),
                message: encryptedMessageB64,
                keys: encryptedKeys
            };
            return JSON.stringify(output);
        }

        async function secretBoxDecrypt(encryptedJson, recipientName) {
            const data = JSON.parse(encryptedJson);
            const iv = base64urlToUint8Array(data.iv);
            const encryptedMessage = base64urlToUint8Array(data.message);
            const encryptedKeyB64 = data.keys[recipientName];
            if (!encryptedKeyB64) throw new Error('No key for this recipient');
            const recipient = state.recipients[recipientName];
            if (!recipient) throw new Error(`Recipient '${recipientName}' not found`);
            if (!recipient.privateKey) throw new Error(`No private key for recipient '${recipientName}'`);

            const privKey = await crypto.subtle.importKey(
                'pkcs8',
                base64urlToUint8Array(recipient.privateKey),
                { name: 'RSA-OAEP', hash: 'SHA-256' },
                true,
                ['decrypt']
            );
            const symKey = await crypto.subtle.decrypt(
                { name: 'RSA-OAEP' },
                privKey,
                base64urlToUint8Array(encryptedKeyB64)
            );
            const symCryptoKey = await crypto.subtle.importKey('raw', symKey, { name: 'AES-GCM' }, false, ['decrypt']);
            const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, symCryptoKey, encryptedMessage);
            return new TextDecoder().decode(decrypted);
        }

            if (state.plugins.has(name)) {

            if (name === 'steganography') {
                commands.stegano_encode = {
                    desc: 'Encode message into an image',
                    exec: async function(args) {
                        if (!state.currentFile.arrayBuffer && !state.currentFile.content) {
                            displayOutput('Upload an image file first.', 'error-output');
                            return;
                        }
                        const message = args.join(' ');
                        if (!message) {
                            displayOutput('Usage: stegano encode <message>', 'error-output');
                            return;
                        }
                        const canvas = document.getElementById('stegano-canvas');
                        const ctx = canvas.getContext('2d');
                        const img = new Image();
                        img.onload = function() {
                            canvas.width = img.width;
                            canvas.height = img.height;
                            ctx.drawImage(img, 0, 0);
                            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            const data = imageData.data;
                            const msgBytes = new TextEncoder().encode(message);
                            const lenBytes = new Uint8Array(4);
                            new DataView(lenBytes.buffer).setUint32(0, msgBytes.length, false);
                            const totalBytes = new Uint8Array(lenBytes.length + msgBytes.length);
                            totalBytes.set(lenBytes);
                            totalBytes.set(msgBytes, lenBytes.length);
                            if (totalBytes.length * 8 > data.length) {
                                displayOutput('Image too small for message.', 'error-output');
                                return;
                            }
                            for (let i = 0; i < totalBytes.length; i++) {
                                for (let bit = 0; bit < 8; bit++) {
                                    const byte = totalBytes[i];
                                    const bitVal = (byte >> (7 - bit)) & 1;
                                    const idx = i * 8 + bit;
                                    data[idx * 4] = (data[idx * 4] & 0xFE) | bitVal;
                                }
                            }
                            ctx.putImageData(imageData, 0, 0);
                            canvas.toBlob(blob => {
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.href = url;
                                a.download = 'stego_' + state.currentFile.name;
                                document.body.appendChild(a);
                                a.click();
                                document.body.removeChild(a);
                                URL.revokeObjectURL(url);
                                displayOutput('Image with hidden message saved.', 'success-output');
                            });
                        };
                        if (state.currentFile.arrayBuffer) {
                            const blob = new Blob([state.currentFile.arrayBuffer]);
                            img.src = URL.createObjectURL(blob);
                        } else {
                            img.src = state.currentFile.dataUrl;
                        }
                    }
                };
                commands.stegano_decode = {
                    desc: 'Decode hidden message from image',
                    exec: async function(args) {
                        if (!state.currentFile.arrayBuffer && !state.currentFile.content) {
                            displayOutput('Upload an image file first.', 'error-output');
                            return;
                        }
                        const canvas = document.getElementById('stegano-canvas');
                        const ctx = canvas.getContext('2d');
                        const img = new Image();
                        img.onload = function() {
                            canvas.width = img.width;
                            canvas.height = img.height;
                            ctx.drawImage(img, 0, 0);
                            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            const data = imageData.data;
                            const lenBytes = new Uint8Array(4);
                            for (let i = 0; i < 4; i++) {
                                let byte = 0;
                                for (let bit = 0; bit < 8; bit++) {
                                    const idx = i * 8 + bit;
                                    const lsb = data[idx * 4] & 1;
                                    byte = (byte << 1) | lsb;
                                }
                                lenBytes[i] = byte;
                            }
                            const msgLen = new DataView(lenBytes.buffer).getUint32(0, false);
                            if (msgLen > 10000) {
                                displayOutput('Invalid message length.', 'error-output');
                                return;
                            }
                            const msgBytes = new Uint8Array(msgLen);
                            for (let i = 0; i < msgLen; i++) {
                                let byte = 0;
                                for (let bit = 0; bit < 8; bit++) {
                                    const idx = (i + 4) * 8 + bit;
                                    if (idx * 4 >= data.length) {
                                        displayOutput('Message truncated or corrupted.', 'error-output');
                                        return;
                                    }
                                    const lsb = data[idx * 4] & 1;
                                    byte = (byte << 1) | lsb;
                                }
                                msgBytes[i] = byte;
                            }
                            const message = new TextDecoder().decode(msgBytes);
                            displayOutput('Hidden message:', 'success-output');
                            displayOutput(message, 'command-output');
                        };
                        if (state.currentFile.arrayBuffer) {
                            const blob = new Blob([state.currentFile.arrayBuffer]);
                            img.src = URL.createObjectURL(blob);
                        } else {
                            img.src = state.currentFile.dataUrl;
                        }
                    }
                };
                state.plugins.add('steganography');
                displayOutput('Plugin "steganography" installed. Added commands: stegano_encode, stegano_decode', 'success-output');
            } else {
                displayOutput(`Plugin '${name}' not found.`, 'error-output');
            }
        }

        async function supabaseSelect(table, match) {
            let query = supabase.from(table).select('*');
            for (const [key, value] of Object.entries(match)) {

            const { data, error } = await query;
            if (error) throw error;
            return data;

            }
            const { data, error } = await query.select().single();
            if (error) throw error;
            return data;
        }

            let query = supabase.from(table).delete();
            for (const [key, value] of Object.entries(match)) {
                query = query.eq(key, value);
            }
            const { error } = await query;
            if (error) throw error;
        }

        async function processCommand(command) {
            const startTime = performance.now();
            const safeCommand = command.replace(/setkey\s+\S{64,}/g, 'setkey [KEY_HIDDEN]');
            state.commandHistory.push(safeCommand);
            if (state.commandHistory.length > 100) state.commandHistory.shift();
            state.historyIndex = -1;
            state.performanceStats.commandCount++;
            
            const parts = command.trim().split(' ');
            const cmd = parts[0].toLowerCase();
            const args = parts.slice(1);
            
            // Track last command
            state.lastCommand = cmd;
            
            // Track crypto ops
            const cryptoCommands = ['genkey', 'setkey', 'encode', 'decode', 'encode_aad', 'decode_aad', 'file_encode', 'file_decode', 'genrsa', 'rsaencrypt', 'rsadecrypt', 'genrsapss', 'rsapsssign', 'rsapssverify', 'gensigkey', 'sign', 'verify', 'hash', 'hash_file', 'encryptpass', 'decryptpass', 'qenc', 'qdec', 'secretbox_encrypt', 'secretbox_decrypt', 'timelock', 'timelock_get', 'benchmark', 'entropy', 'fingerprint'];
            
            // Check key expiry for encryption commands
            if (cryptoCommands.includes(cmd) && state.isKeySet) {
                const keyOk = await checkKeyExpiryAndRotate();
                if (!keyOk) {
                    return; // abort command
                }
            }
            
            if (commands[cmd]) {
                try {
                    const result = commands[cmd].exec(args);
                    if (result && typeof result.then === 'function') {
                        await result;
                    }
                    // Increment usage for encryption commands
                    if (cryptoCommands.includes(cmd) && state.isKeySet) {
                        incrementKeyUsage();
                    }
                } catch (error) {
                    displayOutput(`Command error: ${error.message}`, "error-output");
                    state.errorCount++;
                }
            } else {
                displayOutput(`Command not found: ${cmd}`, "error-output");
                displayOutput("Type 'help' for commands", "info-output");
                state.errorCount++;
            }
            
            const responseTime = performance.now() - startTime;
            state.performanceStats.totalResponseTime += responseTime;
            const responseTimeElement = document.getElementById('response-time');
            if (responseTimeElement) {
                responseTimeElement.textContent = responseTime.toFixed(1) + 'ms';
            }
            
            // Track peak encrypt time
            if (cmd === 'encode' || cmd === 'file_encode' || cmd === 'rsaencrypt' || cmd === 'encryptpass' || cmd === 'qenc' || cmd === 'secretbox_encrypt') {
                if (responseTime > state.peakEncryptTime) {
                    state.peakEncryptTime = responseTime;
                }
            }
            
            setTimeout(() => document.getElementById('terminal-input').focus(), 50);
            updateLineNumbers();
            if (state.autoScroll) scrollToBottom();
            
            // Update sidebar if open
            if (document.getElementById('sidebar').classList.contains('open')) {
                updateSidebarContent();
            }
        }

        // ============================================

        let suggestionDebounceTimer = null;
        
        function setupInputListeners() {
            const input = document.getElementById('terminal-input');
            if (!input) return;
            setTimeout(() => input.focus(), 100);
            
            input.addEventListener('input', function(e) {
                const value = input.value.trim();
                if (suggestionDebounceTimer) clearTimeout(suggestionDebounceTimer);
                suggestionDebounceTimer = setTimeout(() => {
                    if (value !== state.lastInputValue) {
                        showCommandSuggestions(value);
                        state.lastInputValue = value;
                    }
                }, 150);
            });
            
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    if (suggestionDebounceTimer) clearTimeout(suggestionDebounceTimer);
                    hideCommandSuggestions();
                    const command = input.value.trim();
                    if (command) {
                        displayInput(command);
                        processCommand(command);
                        input.value = '';
                        state.lastInputValue = '';
                    }
                }
            });
            
            input.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (state.currentSuggestions.length > 0) {
                        navigateSuggestions('up');
                    } else {
                        if (state.commandHistory.length === 0) return;
                        if (state.historyIndex < state.commandHistory.length - 1) state.historyIndex++;
                        input.value = state.commandHistory[state.commandHistory.length - 1 - state.historyIndex] || '';
                        state.lastInputValue = input.value;
                        showCommandSuggestions(input.value);
                    }
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (state.currentSuggestions.length > 0) {
                        navigateSuggestions('down');
                    } else {
                        if (state.historyIndex > 0) state.historyIndex--;
                        else state.historyIndex = -1;
                        input.value = state.historyIndex === -1 ? '' : state.commandHistory[state.commandHistory.length - 1 - state.historyIndex];
                        state.lastInputValue = input.value;
                        showCommandSuggestions(input.value);
                    }
                } else if (e.key === 'Tab') {
                    e.preventDefault();
                    if (state.currentSuggestions.length > 0 && state.suggestionIndex >= 0) {
                        selectSuggestion(state.suggestionIndex);
                    } else {
                        autoCompleteCommand(input.value);
                    }
                } else if (e.key === 'Escape') {
                    hideCommandSuggestions();
                }
            });
            
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.terminal-input-section')) {
                    hideCommandSuggestions();
                }
            });
        }
        
        function showCommandSuggestions(inputText) {
            if (!inputText || inputText.trim() === '') {
                hideCommandSuggestions();
                return;
            }
            const suggestionBox = document.getElementById('suggestion-box');
            if (!suggestionBox) return;
            const input = inputText.toLowerCase().trim();
            const matches = [];
            for (const [cmd, data] of Object.entries(commands)) {
                if (cmd.startsWith(input) || data.desc.toLowerCase().includes(input)) {
                    matches.push({ type: 'command', name: cmd, description: data.desc });
                }
            }
            matches.sort((a, b) => (a.name.startsWith(input) ? 0 : 1) - (b.name.startsWith(input) ? 0 : 1));
            const limitedMatches = matches.slice(0, 6);
            if (limitedMatches.length === 0) {
                hideCommandSuggestions();
                return;
            }
            suggestionBox.innerHTML = '';
            limitedMatches.forEach((match, index) => {
                const item = document.createElement('div');
                item.className = 'suggestion-item';
                if (index === 0) {
                    item.classList.add('selected');
                    state.suggestionIndex = 0;
                }
                item.innerHTML = `<div><span class="suggestion-command">${match.name}</span></div>
                                 <div><span class="suggestion-desc">${match.description}</span></div>`;
                item.addEventListener('click', () => selectSuggestion(index));
                suggestionBox.appendChild(item);
            });
            suggestionBox.style.display = 'block';
            state.currentSuggestions = limitedMatches;
        }
        
        function hideCommandSuggestions() {
            const suggestionBox = document.getElementById('suggestion-box');
            if (suggestionBox) suggestionBox.style.display = 'none';
            state.currentSuggestions = [];
            state.suggestionIndex = -1;
        }
        
        function selectSuggestion(index) {
            if (index < 0 || index >= state.currentSuggestions.length) return;
            const suggestion = state.currentSuggestions[index];
            const inputField = document.getElementById('terminal-input');
            if (inputField) {
                inputField.value = suggestion.name + ' ';
                inputField.focus();
                hideCommandSuggestions();
            }
        }
        
        function navigateSuggestions(direction) {
            if (state.currentSuggestions.length === 0) return;
            const suggestionBox = document.getElementById('suggestion-box');
            const items = suggestionBox.querySelectorAll('.suggestion-item');
            if (items.length === 0) return;
            if (state.suggestionIndex >= 0 && state.suggestionIndex < items.length) {
                items[state.suggestionIndex].classList.remove('selected');
            }
            let newIndex;
            if (direction === 'down') {
                newIndex = state.suggestionIndex + 1;
                if (newIndex >= state.currentSuggestions.length) newIndex = 0;
            } else {
                newIndex = state.suggestionIndex - 1;
                if (newIndex < 0) newIndex = state.currentSuggestions.length - 1;
            }
            state.suggestionIndex = newIndex;
            items[newIndex].classList.add('selected');
        }
        
        function autoCompleteCommand(input) {
            if (!input) return;
            const matches = Object.keys(commands).filter(cmd => cmd.startsWith(input.toLowerCase()));
            if (matches.length === 1) {
                const inputField = document.getElementById('terminal-input');
                if (inputField) {
                    inputField.value = matches[0] + ' ';
                    inputField.focus();
                    state.lastInputValue = inputField.value;
                    setTimeout(() => showCommandSuggestions(inputField.value), 50);
                }
            } else if (matches.length > 1) {
                displayOutput("Suggestions: " + matches.join(', '), "info-output");
            }
        }
